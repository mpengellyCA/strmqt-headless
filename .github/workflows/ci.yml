name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  strmqtctl:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Installs as a package
        run: |
          python -m pip install .
          strmqtctl --version
          strmqtctl --help >/dev/null

  image-scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Shell
        run: |
          bash -n docker/entrypoint.sh
          shellcheck docker/entrypoint.sh
